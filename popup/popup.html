<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <link rel="stylesheet" href="popup.css">
  <title>BlendConv</title>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <h1>BlendConv</h1>
    </div>
    <button id="clear-all-btn" class="clear-btn" title="Clear all conversations">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    </button>
  </header>

  <!-- Conversation list -->
  <div id="conversation-list" class="conversation-list">
    <!-- Conversations will be injected here -->
  </div>

  <!-- Empty state -->
  <div id="empty-state" class="empty-state" style="display: none;">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <p>No conversations captured yet.</p>
    <span>Visit ChatGPT or Claude and click the capture button.</span>
  </div>

  <!-- Action bar -->
  <div id="action-bar" class="action-bar" style="display: none;">
    <span id="selected-count" class="selected-count">0 selected</span>
    <div class="action-buttons">
      <button id="merge-btn" class="btn btn-primary" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Merge
      </button>
    </div>
  </div>

  <!-- Merge result overlay -->
  <div id="merge-overlay" class="merge-overlay" style="display: none;">
    <div class="merge-header">
      <h2>Merged Context</h2>
      <button id="close-merge" class="close-btn">&times;</button>
    </div>
    <pre id="merge-output" class="merge-output"></pre>
    <div class="merge-actions">
      <button id="copy-btn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy
      </button>
      <button id="open-chatgpt-btn" class="btn btn-chatgpt">Open in ChatGPT</button>
      <button id="open-claude-btn" class="btn btn-claude">Open in Claude</button>
    </div>
  </div>

  <script src="../utils/merger.js"></script>
  <script src="popup.js"></script>
</body>
</html>
